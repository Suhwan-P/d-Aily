# Render Blueprint — 무료 웹 서비스 1개로 화면+실시간 서버를 함께 띄운다
services:
  - type: web
    name: wae-party
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY # 선택: 넣으면 왜무새 가짜 이유를 Claude가 즉석에서 만든다
        sync: false
